<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171b"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93bbff"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
  </defs>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>
    <rect x="0" y="0" width="10" height="630" fill="url(#bar)"/>

    <g>
      <rect x="90" y="78" width="22" height="22" rx="5" fill="url(#bar)"/>
      <text x="126" y="96" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#f4f4f6">Downstream</text>
    </g>

    <text x="90" y="339" font-size="86" font-weight="700" letter-spacing="-1.5" fill="#f4f4f6">Death Is Optional</text>
    <text x="90" y="403" font-size="30" font-weight="400" fill="#9a9aa3">We die twice — once when the body stops, and again the last time</text>
    <text x="90" y="445" font-size="30" font-weight="400" fill="#9a9aa3">someone says our name. AI may turn the second death into a choice.</text>

    <line x1="90" y1="540" x2="1120" y2="540" stroke="#2a2a2e" stroke-width="1"/>
    <text x="90" y="578" font-size="26" font-weight="600" fill="#6ea8fe">papangelis.com</text>
    <text x="1120" y="578" font-size="24" font-weight="400" text-anchor="end" fill="#9a9aa3">Thanos Papangelis</text>
  </g>
</svg>